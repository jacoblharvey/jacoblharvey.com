name: Deploy
on: 
  workflow_dispatch:
  release:
    types: [ published ]
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Pull latest tag via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            whoami
            ls -al

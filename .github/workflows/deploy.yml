name: Deploy
on: 
  workflow_dispatch:
  release:
    types: [ published ]
jobs:
  Deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd ${{ secrets.PATH }}
            git pull --tags origin release
            git checkout $(git describe --tags $(git rev-list --tags --max-count=1))
            git status

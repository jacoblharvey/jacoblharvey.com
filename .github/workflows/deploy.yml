name: Deploy
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            whoami
            ls -al
